[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.log
autorestart=true
priority=100

[program:laravel-worker]
command=php /var/www/artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-jobs=1000
directory=/var/www
autostart=true
autorestart=true
user=www-data
numprocs=2
stdout_logfile=/var/log/supervisor/laravel-worker.log
stderr_logfile=/var/log/supervisor/laravel-worker.log
stopwaitsecs=3600

[program:laravel-scheduler]
command=sh -c "while [ true ]; do (php /var/www/artisan schedule:run --verbose --no-interaction &); sleep 60; done"
directory=/var/www
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/supervisor/laravel-scheduler.log
stderr_logfile=/var/log/supervisor/laravel-scheduler.log

[program:laravel-horizon]
command=php /var/www/artisan horizon
directory=/var/www
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/supervisor/laravel-horizon.log
stderr_logfile=/var/log/supervisor/laravel-horizon.log
stopwaitsecs=3600